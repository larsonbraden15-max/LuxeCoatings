<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Luxe Coatings LLC</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
background-color: #000000;
color: white;
font-family: Arial, Helvetica, sans-serif;
min-height: 100vh;

display: flex;
justify-content: center;
align-items: center;

text-align: center;
}

.thank-you-container {
width: 90%;
max-width: 700px;
padding: 50px 30px;
}

.logo {
width: 280px;
max-width: 80%;
height: auto;
margin-bottom: 35px;
}

h1 {
color: #d4af37;
font-size: 48px;
margin-bottom: 20px;
}

p {
font-size: 20px;
line-height: 1.6;
color: #ffffff;
margin-bottom: 35px;
}

.confirmation {
color: #d4af37;
font-size: 16px;
margin-bottom: 35px;
}

.return-button {
display: inline-block;
padding: 14px 30px;

background-color: #d4af37;
color: #000000;

text-decoration: none;
font-weight: bold;
font-size: 17px;

border-radius: 4px;

transition: 0.3s;
}

.return-button:hover {
background-color: #ffffff;
color: #000000;
}

footer {
margin-top: 50px;
color: #888888;
font-size: 14px;
}

</style>

</head>

<body>

<div class="thank-you-container">

<img
src="Logo.PNG"
alt="Luxe Coatings LLC Logo"
class="logo"
>

<h1>Thank You!</h1>

<p>
Your quote request has been successfully submitted.
</p>

<p class="confirmation">
A member of Luxe Coatings LLC will review your request
and get back to you soon.
</p>

<a
href="index.html"
class="return-button"
>
Return to Luxe Coatings
</a>

<footer>
© 2026 Luxe Coatings LLC
</footer>

</div>

</body>

</html>
